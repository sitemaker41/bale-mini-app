<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>جزوات دانش‌کده۴۱</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css"
    rel="stylesheet"
  >

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
  >

  <style>
    :root {
      --midnight: #0b1d33;
      --navy: #132b49;
      --navy-light: #1d3c60;
      --gold: #b98b45;
      --gold-light: #d6b06a;
      --cream: #f4ead5;
      --bg: #f5efe3;
      --text: #10243b;
      --muted: #66758a;
      --card: rgba(255,255,255,.78);
      --border: rgba(11,29,51,.10);
      --shadow: 0 18px 45px rgba(11,29,51,.10);
    }

    body.dark {
      --bg: #081523;
      --text: #f4ead5;
      --muted: #aebaca;
      --card: rgba(19,43,73,.78);
      --border: rgba(255,255,255,.08);
      --shadow: 0 18px 45px rgba(0,0,0,.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
    font-family: Vazirmatn, Tahoma, sans-serif;
    background:
        radial-gradient(circle at 15% 10%, rgba(185,139,69,.12), transparent 30%),
        radial-gradient(circle at 85% 20%, rgba(29,60,96,.10), transparent 30%),
        var(--bg);
    color: var(--text);
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    transition: background .3s ease, color .3s ease;
    }

    button {
      font-family: inherit;
    }

    /* HEADER */

    header {
      width: 100%;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      min-height: 74px;
      padding: 12px 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      border: 1px solid var(--border);
      border-radius: 22px;

      background: linear-gradient(
        135deg,
        rgba(11,29,51,.97),
        rgba(19,43,73,.95)
      );

      box-shadow: var(--shadow);
      color: white;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      min-width: 0;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 900;
      color: #fff;
    }

    .brand-subtitle {
      margin-top: 2px;
      font-size: 12px;
      color: rgba(255,255,255,.70);
    }

    .theme-btn {
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 13px;

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;
      color: white;
      background: rgba(255,255,255,.08);

      transition: .2s ease;
      flex-shrink: 0;
    }

    .theme-btn:hover {
      background: rgba(255,255,255,.15);
      transform: translateY(-2px);
    }

    /* MAIN */

    main {
        width: 100%;
        max-width: 1100px;
        margin: auto;
        padding: 25px 20px 40px;

        flex: 1;
    }

    .hero {
      position: relative;
      overflow: hidden;

      padding: 48px 30px;
      border-radius: 30px;

      background:
        radial-gradient(circle at 10% 20%, rgba(214,176,106,.22), transparent 30%),
        linear-gradient(135deg, var(--midnight), var(--navy));

      color: white;
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      left: -70px;
      bottom: -100px;
      background: rgba(214,176,106,.10);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 760px;
    }

    .hero-title {
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.35;
      font-weight: 900;
      margin-bottom: 14px;
    }

    .hero-title span {
      color: var(--gold-light);
    }

    .hero-description {
      font-size: 15px;
      line-height: 2;
      color: rgba(255,255,255,.78);
      max-width: 700px;
    }

    /* LESSONS */

    .section-title {
      margin: 42px 0 18px;

      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 21px;
      font-weight: 900;
    }

    .section-title::before {
      content: "";
      width: 6px;
      height: 28px;
      border-radius: 20px;
      background: linear-gradient(
        to bottom,
        var(--gold-light),
        var(--gold)
      );
    }

    .lessons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .lesson {
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;

      background: var(--card);
      backdrop-filter: blur(16px);

      box-shadow: 0 8px 25px rgba(11,29,51,.06);

      transition: .25s ease;
    }

    .lesson:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .lesson-header {
      width: 100%;
      border: 0;
      background: transparent;

      padding: 19px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      color: var(--text);
      cursor: pointer;
      text-align: right;
      font-size: 15px;
      font-weight: 800;
    }

    .lesson-header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .lesson-number {
      width: 39px;
      height: 39px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: white;
      background: linear-gradient(
        135deg,
        var(--midnight),
        var(--navy-light)
      );

      font-size: 14px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .lesson-arrow {
      color: var(--gold);
      transition: transform .25s ease;
    }

    .lesson.open .lesson-arrow {
      transform: rotate(180deg);
    }

    .notes {
      max-height: 0;
      overflow: hidden;
      transition: max-height .35s ease;
    }

    .notes-inner {
      padding: 0 14px 14px;
      display: grid;
      gap: 8px;
    }

    .note {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      width: 100%;
      padding: 13px 15px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background: rgba(185,139,69,.07);

      cursor: pointer;
      transition: .2s ease;
    }

    .note:hover {
      background: rgba(185,139,69,.14);
      transform: translateX(-2px);
    }

    .note-name {
      display: flex;
      align-items: center;
      gap: 10px;

      color: var(--text);
      font-size: 13px;
      font-weight: 700;
    }

    .note-name i {
      color: var(--gold);
      font-size: 16px;
    }

    .note-arrow {
      color: var(--muted);
      font-size: 12px;
    }

    /* FOOTER */

    footer {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;

    padding: 20px 20px 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-direction: column;
    gap: 6px;

    color: var(--muted);
    font-size: 12px;
    text-align: center;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(3,12,22,.70);
      backdrop-filter: blur(9px);

      opacity: 0;
      visibility: hidden;
      transition: .25s ease;
    }

    .modal.show {
      opacity: 1;
      visibility: visible;
    }

    .modal-box {
      position: relative;

      width: min(500px, 100%);
      max-height: 92vh;
      overflow: hidden;

      padding: 32px 24px 25px;

      border-radius: 26px;
      border: 1px solid var(--border);

      background: var(--bg);
      box-shadow: 0 30px 80px rgba(0,0,0,.35);

      transform: translateY(15px) scale(.97);
      transition: .25s ease;
    }

    .modal.show .modal-box {
      transform: translateY(0) scale(1);
    }

    .close-btn,
    .preview-close-btn {
      position: absolute;
      top: 13px;
      right: 13px;

      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: var(--muted);
      background: rgba(128,128,128,.10);

      cursor: pointer;
      z-index: 20;

      transition: .2s ease;
    }

    .close-btn:hover,
    .preview-close-btn:hover {
      color: white;
      background: #a33;
    }

    .download-icon {
      width: 72px;
      height: 72px;
      margin: 5px auto 17px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(
        135deg,
        var(--midnight),
        var(--navy-light)
      );

      color: var(--gold-light);
      font-size: 28px;

      box-shadow: 0 12px 30px rgba(11,29,51,.20);
    }

    .modal-box h3 {
      text-align: center;
      color: var(--text);
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 8px;
    }

    #modalDescription {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.9;
      margin-bottom: 22px;
    }

    .note-actions {
      display: flex;
      gap: 10px;
    }

    .note-action-btn {
      flex: 1;

      min-height: 50px;

      border: 0;
      border-radius: 15px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      font-size: 13px;
      font-weight: 800;

      transition: .2s ease;
    }

    .note-action-btn:hover {
      transform: translateY(-2px);
    }

    .preview-btn {
      color: white;
      background: linear-gradient(
        135deg,
        var(--midnight),
        var(--navy-light)
      );
    }

    .download-btn {
      color: var(--midnight);
      background: linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
      );
    }

    .note-action-btn:disabled {
      opacity: .6;
      cursor: wait;
      transform: none;
    }

    /* PDF PREVIEW */

    .pdf-preview {
      position: relative;

      display: none;

      height: min(72vh, 700px);

      margin-top: 8px;

      border-radius: 16px;
      overflow-y: auto;
      overflow-x: hidden;

      background: #777;

      padding: 45px 10px 15px;

      direction: ltr;
    }

    .pdf-preview.show {
      display: block;
    }

    .preview-close-btn {
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,.65);
      color: white;
    }

    #pdfPages {
      width: 100%;

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .pdf-page {
      display: block;

      max-width: 100%;
      height: auto;

      background: white;

      box-shadow: 0 5px 20px rgba(0,0,0,.25);
    }

    .pdf-loading {
      direction: rtl;

      min-height: 200px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;

      color: white;
      font-size: 13px;
    }

    .pdf-loading i {
      font-size: 28px;
    }

    .pdf-error {
      direction: rtl;

      min-height: 200px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 25px;

      color: white;
      text-align: center;
      line-height: 2;
      font-size: 13px;
    }

    /* RESPONSIVE */

    @media (max-width: 760px) {
      header {
        padding: 12px;
      }

      .header-inner {
        border-radius: 18px;
      }

      main {
        padding: 15px 12px 30px;
      }

      .hero {
        padding: 35px 22px;
        border-radius: 24px;
      }

      .lessons {
        grid-template-columns: 1fr;
      }

      .modal {
        padding: 10px;
      }

      .modal-box {
        max-height: 95vh;
        border-radius: 21px;
        padding: 30px 16px 18px;
      }

      .note-actions {
        flex-direction: column;
      }

      .pdf-preview {
        height: 74vh;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <div class="header-inner">

      <div class="brand">
        <img
          src="Logo_Bot.png"
          alt="دانش‌کده۴۱"
          class="brand-logo"
        >

        <div class="brand-text">
          <div class="brand-title">
            دانش‌کده۴۱
          </div>

          <div class="brand-subtitle">
            همه جزوه‌ها، یکجا و مرتب
          </div>
        </div>
      </div>

      <button
        class="theme-btn"
        id="themeBtn"
        aria-label="تغییر حالت نمایش"
      >
        <i class="fas fa-moon"></i>
      </button>

    </div>
  </header>


  <!-- MAIN -->

  <main>

    <section class="hero">
      <div class="hero-content">

        <h1 class="hero-title">
          جزوات <span>دانش‌کده۴۱</span>
        </h1>

        <p class="hero-description">
          درس موردنظرت رو انتخاب کن و جزوه‌ای که می‌خوای رو
          سریع و راحت پیدا و دانلود کن.
        </p>

      </div>
    </section>


    <h2 class="section-title">
      جزوات درسی
    </h2>


    <section
      class="lessons"
      id="lessonsContainer"
    ></section>

  </main>


  <!-- FOOTER -->

  <footer>

    <div>
      طراحی و توسعه: دانیال ایمان‌پور
    </div>

    <div>
      سال ۱۴۰۵ | سال تحصیلی نهم
    </div>

  </footer>


  <!-- MODAL -->

  <div
    class="modal"
    id="downloadModal"
  >

    <div
      class="modal-box"
      id="modalBox"
    >

      <button
        class="close-btn"
        id="closeModal"
        aria-label="بستن"
      >
        <i class="fas fa-xmark"></i>
      </button>


      <div class="download-icon">
        <i class="fas fa-file-arrow-down"></i>
      </div>


      <h3 id="modalTitle">
        جزوه
      </h3>


      <p id="modalDescription">
        برای مشاهده یا دریافت فایل، یکی از گزینه‌های زیر را انتخاب کنید.
      </p>


      <!-- ACTION BUTTONS -->

      <div
        class="note-actions"
        id="noteActions"
      >

        <button
          class="note-action-btn preview-btn"
          id="previewBtn"
        >
          <i class="fas fa-eye"></i>
          پیش‌نمایش
        </button>


        <button
          class="note-action-btn download-btn"
          id="downloadBtn"
        >
          <i class="fas fa-download"></i>
          دانلود جزوه
        </button>

      </div>


      <!-- PDF PREVIEW -->

      <div
        class="pdf-preview"
        id="pdfPreview"
      >

        <button
          class="preview-close-btn"
          id="previewCloseBtn"
          aria-label="بازگشت"
          title="بازگشت"
        >
          <i class="fas fa-xmark"></i>
        </button>


        <div id="pdfPages"></div>

      </div>

    </div>

  </div>


  <!-- PDF.JS -->

  <script type="module">

    import * as pdfjsLib from
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";


    /* =========================
       LESSON DATA
    ========================= */

    const lessons = [

      {
        id: 1,

        name: "به زودی",

        notes: [

          {
            name: "به زودی",
            url: "lessons/lesson-1/Be_Zoodi....pdf"
          }

        ]
      }

    ];


    /* =========================
       LESSON RENDER
    ========================= */

    const lessonsContainer =
      document.getElementById("lessonsContainer");


    lessons.forEach(lesson => {

      const lessonElement =
        document.createElement("div");

      lessonElement.className = "lesson";


      lessonElement.innerHTML = `

        <button
          class="lesson-header"
          type="button"
        >

          <div class="lesson-header-right">

            <div class="lesson-number">
              ${lesson.id}
            </div>

            <span>
              ${lesson.name}
            </span>

          </div>

          <i class="fas fa-chevron-down lesson-arrow"></i>

        </button>


        <div class="notes">

          <div class="notes-inner">

            ${lesson.notes.map((note, index) => `

              <div
                class="note"
                data-lesson="${lesson.id}"
                data-note="${index}"
              >

                <div class="note-name">

                  <i class="fas fa-file-lines"></i>

                  <span>
                    ${note.name}
                  </span>

                </div>

                <i class="fas fa-chevron-left note-arrow"></i>

              </div>

            `).join("")}

          </div>

        </div>

      `;


      lessonsContainer.appendChild(lessonElement);


      const lessonHeader =
        lessonElement.querySelector(".lesson-header");

      const notes =
        lessonElement.querySelector(".notes");


      lessonHeader.addEventListener("click", () => {

        const isOpen =
          lessonElement.classList.contains("open");


        document
          .querySelectorAll(".lesson.open")
          .forEach(item => {

            if (item !== lessonElement) {

              item.classList.remove("open");

              item.querySelector(".notes").style.maxHeight =
                null;

            }

          });


        if (isOpen) {

          lessonElement.classList.remove("open");

          notes.style.maxHeight = null;

        } else {

          lessonElement.classList.add("open");

          notes.style.maxHeight =
            notes.scrollHeight + "px";

        }

      });

    });


    /* =========================
       MODAL ELEMENTS
    ========================= */

    const modal =
      document.getElementById("downloadModal");

    const modalBox =
      document.getElementById("modalBox");

    const closeModal =
      document.getElementById("closeModal");

    const modalTitle =
      document.getElementById("modalTitle");

    const modalDescription =
      document.getElementById("modalDescription");

    const noteActions =
      document.getElementById("noteActions");

    const previewBtn =
      document.getElementById("previewBtn");

    const downloadBtn =
      document.getElementById("downloadBtn");

    const previewCloseBtn =
      document.getElementById("previewCloseBtn");

    const pdfPreview =
      document.getElementById("pdfPreview");

    const pdfPages =
      document.getElementById("pdfPages");


    let currentPdfUrl = "";


    /* =========================
       OPEN NOTE
    ========================= */

    document.querySelectorAll(".note").forEach(note => {

      note.addEventListener("click", () => {

        const lessonId =
          Number(note.dataset.lesson);

        const noteIndex =
          Number(note.dataset.note);


        const selectedLesson =
          lessons.find(
            lesson => lesson.id === lessonId
          );


        if (!selectedLesson) return;


        const selectedNote =
          selectedLesson.notes[noteIndex];


        if (!selectedNote) return;


        modalTitle.textContent =
          `${selectedLesson.name} — ${selectedNote.name}`;


        currentPdfUrl =
          selectedNote.url;


        modalDescription.textContent =
          "برای مشاهده یا دریافت فایل، یکی از گزینه‌های زیر را انتخاب کنید.";


        noteActions.style.display =
          "flex";


        pdfPreview.classList.remove("show");


        pdfPages.innerHTML = "";


        modalBox.style.width =
          "";


        modal.classList.add("show");


        document.body.style.overflow =
          "hidden";

      });

    });


    /* =========================
       PDF PREVIEW
    ========================= */

    previewBtn.addEventListener("click", async () => {

      if (!currentPdfUrl) return;


      noteActions.style.display =
        "none";


      pdfPreview.classList.add("show");


      modalDescription.textContent =
        "پیش‌نمایش جزوه";


      modalBox.style.width =
        "min(900px, 100%)";


      pdfPages.innerHTML = `

        <div class="pdf-loading">

          <i class="fas fa-spinner fa-spin"></i>

          <span>
            در حال آماده‌سازی پیش‌نمایش...
          </span>

        </div>

      `;


      try {

        const loadingTask =
          pdfjsLib.getDocument({
            url: currentPdfUrl
          });


        const pdf =
          await loadingTask.promise;


        pdfPages.innerHTML = "";


        for (
          let pageNumber = 1;
          pageNumber <= pdf.numPages;
          pageNumber++
        ) {

          const page =
            await pdf.getPage(pageNumber);


          const containerWidth =
            Math.min(
              pdfPages.clientWidth - 10,
              850
            );


          const originalViewport =
            page.getViewport({
              scale: 1
            });


          const scale =
            containerWidth /
            originalViewport.width;


          const viewport =
            page.getViewport({
              scale
            });


          const canvas =
            document.createElement("canvas");


          canvas.className =
            "pdf-page";


          const context =
            canvas.getContext("2d");


          const outputScale =
            window.devicePixelRatio || 1;


          canvas.width =
            Math.floor(
              viewport.width * outputScale
            );


          canvas.height =
            Math.floor(
              viewport.height * outputScale
            );


          canvas.style.width =
            `${Math.floor(viewport.width)}px`;


          canvas.style.height =
            `${Math.floor(viewport.height)}px`;


          pdfPages.appendChild(canvas);


          await page.render({

            canvasContext: context,

            viewport: viewport,

            transform:
              outputScale !== 1
                ? [outputScale, 0, 0, outputScale, 0, 0]
                : null

          }).promise;

        }

      } catch (error) {

        console.error(
          "PDF Preview Error:",
          error
        );


        pdfPages.innerHTML = `

          <div class="pdf-error">

            خطا در نمایش پیش‌نمایش PDF.<br>

          </div>

        `;

      }

    });


    /* =========================
       CLOSE PDF PREVIEW
    ========================= */

    previewCloseBtn.addEventListener("click", () => {

      pdfPreview.classList.remove("show");


      pdfPages.innerHTML = "";


      noteActions.style.display =
        "flex";


      modalDescription.textContent =
        "برای مشاهده یا دریافت فایل، یکی از گزینه‌های زیر را انتخاب کنید.";


      modalBox.style.width =
        "";

    });


    /* =========================
       DOWNLOAD PDF
    ========================= */

    downloadBtn.addEventListener("click", () => {
    if (!currentPdfUrl) return;

    const url = new URL(
        currentPdfUrl,
        window.location.href
    ).href;

    window.open(url, "_blank");
    });
    
    /* =========================
       CLOSE MODAL
    ========================= */

    function closeDownloadModal() {

      modal.classList.remove("show");


      pdfPreview.classList.remove(
        "show"
      );


      pdfPages.innerHTML = "";


      noteActions.style.display =
        "flex";


      modalDescription.textContent =
        "برای مشاهده یا دریافت فایل، یکی از گزینه‌های زیر را انتخاب کنید.";


      modalBox.style.width =
        "";


      currentPdfUrl =
        "";


      document.body.style.overflow =
        "";

    }


    closeModal.addEventListener(
      "click",
      closeDownloadModal
    );


    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          closeDownloadModal();

        }

      }
    );


    /* =========================
       ESCAPE KEY
    ========================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key !== "Escape"
        ) {
          return;
        }


        if (
          pdfPreview.classList.contains(
            "show"
          )
        ) {

          previewCloseBtn.click();

        } else {

          closeDownloadModal();

        }

      }
    );


    /* =========================
       DARK / LIGHT MODE
    ========================= */

    const themeBtn =
      document.getElementById(
        "themeBtn"
      );


    function updateThemeIcon() {

      const icon =
        themeBtn.querySelector("i");


      if (
        document.body.classList.contains(
          "dark"
        )
      ) {

        icon.className =
          "fas fa-sun";

      } else {

        icon.className =
          "fas fa-moon";

      }

    }


    const savedTheme =
      localStorage.getItem(
        "theme"
      );


    if (
      savedTheme === "dark"
    ) {

      document.body.classList.add(
        "dark"
      );

    }


    updateThemeIcon();


    themeBtn.addEventListener(
      "click",
      () => {

        document.body.classList.toggle(
          "dark"
        );


        const theme =
          document.body.classList.contains(
            "dark"
          )
            ? "dark"
            : "light";


        localStorage.setItem(
          "theme",
          theme
        );


        updateThemeIcon();

      }
    );

  </script>

</body>
</html>

<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1d33">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />


<title>جزوات دانش‌کده ۴۱</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    :root {
        --midnight: #0b1d33;
        --navy: #132b49;
        --navy-light: #1d3c60;
        --gold: #b98b45;
        --gold-light: #d6b06a;
        --cream: #f4ead5;
        --cream-dark: #dfd0b5;

        --bg: #f5efe3;
        --card: rgba(255,255,255,0.58);
        --text: #0b1d33;
        --text-soft: #536173;
        --border: rgba(11,29,51,0.12);
        --shadow: 0 18px 50px rgba(11,29,51,0.13);
    }

    body.dark {
        --bg: #071321;
        --card: rgba(19,43,73,0.62);
        --text: #f4ead5;
        --text-soft: #b9c2ce;
        --border: rgba(244,234,213,0.13);
        --shadow: 0 18px 55px rgba(0,0,0,0.35);
    }

    body {
        min-height: 100vh;
        font-family: 'Vazirmatn', 'Inter', sans-serif;
        background:
            radial-gradient(circle at 10% 10%, rgba(185,139,69,.18), transparent 28%),
            radial-gradient(circle at 90% 20%, rgba(29,60,96,.17), transparent 30%),
            var(--bg);
        color: var(--text);
        transition: background .35s ease, color .35s ease;
        overflow-x: hidden;
    }

    /* Background decoration */
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: .35;
        background-image:
            linear-gradient(rgba(185,139,69,.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(185,139,69,.035) 1px, transparent 1px);
        background-size: 35px 35px;
        z-index: -1;
    }

    .container {
        width: min(1180px, calc(100% - 32px));
        margin: auto;
    }

    /* Header */
    header {
        padding: 28px 0 15px;
    }

    .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .brand {
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .logo {
        width: 55px;
        height: 55px;
        border-radius: 17px;
        display: grid;
        place-items: center;
        color: var(--cream);
        font-size: 25px;
        font-weight: bold;
        background:
            linear-gradient(135deg, var(--midnight), var(--navy-light)),
            var(--midnight);
        border: 1px solid rgba(214,176,106,.35);
        box-shadow:
            0 10px 30px rgba(11,29,51,.25),
            inset 0 1px 0 rgba(255,255,255,.15);
    }

    .brand h1 {
        font-size: clamp(20px, 3vw, 29px);
        font-weight: 800;
        letter-spacing: -.7px;
    }

    .brand p {
        color: var(--text-soft);
        margin-top: 5px;
        font-size: 13px;
    }

    /* Glass button */
    .glass-btn {
        border: 1px solid rgba(255,255,255,.25);
        color: var(--cream);
        background:
            linear-gradient(
                135deg,
                rgba(19,43,73,.82),
                rgba(185,139,69,.82)
            );
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        box-shadow:
            0 10px 25px rgba(11,29,51,.18),
            inset 0 1px 1px rgba(255,255,255,.22);
        cursor: pointer;
        transition: .25s ease;
    }

    .glass-btn:hover {
        transform: translateY(-2px);
        box-shadow:
            0 14px 32px rgba(11,29,51,.25),
            inset 0 1px 1px rgba(255,255,255,.28);
    }

    .theme-btn {
        width: 48px;
        height: 48px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        font-size: 21px;
    }

    /* Hero */
    .hero {
        text-align: center;
        padding: 50px 10px 35px;
    }

    .hero-badge {
        display: inline-flex;
        padding: 8px 15px;
        border-radius: 100px;
        color: var(--gold-light);
        background: rgba(185,139,69,.11);
        border: 1px solid rgba(185,139,69,.25);
        font-size: 12px;
        margin-bottom: 18px;
    }

    .hero h2 {
        font-size: clamp(28px, 5vw, 48px);
        line-height: 1.35;
        font-weight: 900;
        background: linear-gradient(
            90deg,
            var(--midnight),
            var(--gold),
            var(--navy-light)
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
    }

    body.dark .hero h2 {
        background: linear-gradient(
            90deg,
            var(--cream),
            var(--gold-light),
            #8da7c5
        );
        -webkit-background-clip: text;
        background-clip: text;
    }

    .hero p {
        max-width: 650px;
        margin: 15px auto 0;
        color: var(--text-soft);
        line-height: 2;
        font-size: 14px;
    }

    /* Grid */
    .lessons-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 18px;
        padding-bottom: 60px;
    }

    .lesson {
        border: 1px solid var(--border);
        border-radius: 23px;
        background: var(--card);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: var(--shadow);
        overflow: hidden;
        transition: .3s ease;
    }

    .lesson:hover {
        transform: translateY(-3px);
        border-color: rgba(185,139,69,.3);
    }

    .lesson-header {
        width: 100%;
        min-height: 76px;
        border: 0;
        background: transparent;
        color: var(--text);
        padding: 15px 17px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        font-family: inherit;
        text-align: right;
    }

    .lesson-title {
        display: flex;
        align-items: center;
        gap: 13px;
    }

    .lesson-number {
        width: 45px;
        height: 45px;
        flex-shrink: 0;
        border-radius: 14px;
        display: grid;
        place-items: center;
        color: var(--cream);
        font-size: 17px;
        font-weight: bold;
        background:
            linear-gradient(135deg, var(--midnight), var(--navy-light));
        box-shadow: inset 0 1px 0 rgba(255,255,255,.15);
    }

    .lesson-name {
        font-size: 16px;
        font-weight: 800;
    }

    .lesson-count {
        display: block;
        color: var(--text-soft);
        font-size: 11px;
        margin-top: 4px;
    }

    .arrow {
        width: 31px;
        height: 31px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        color: var(--gold);
        background: rgba(185,139,69,.1);
        transition: transform .3s ease;
        font-size: 16px;
    }

    .lesson.active .arrow {
        transform: rotate(180deg);
    }

    .notes {
        max-height: 0;
        overflow: hidden;
        transition: max-height .4s ease;
    }

    .notes-inner {
        padding: 0 14px 14px;
    }

    .note {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 13px 14px;
        margin-top: 8px;
        border-radius: 15px;
        border: 1px solid var(--border);
        background:
            linear-gradient(
                135deg,
                rgba(255,255,255,.13),
                rgba(185,139,69,.08)
            );
        color: var(--text);
        cursor: pointer;
        transition: .25s ease;
        text-align: right;
        font-family: inherit;
    }

    .note:hover {
        transform: translateX(-3px);
        border-color: rgba(185,139,69,.4);
        background:
            linear-gradient(
                135deg,
                rgba(185,139,69,.14),
                rgba(29,60,96,.1)
            );
    }

    .note-left {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .note-icon {
        width: 35px;
        height: 35px;
        display: grid;
        place-items: center;
        border-radius: 11px;
        color: var(--gold-light);
        background: rgba(185,139,69,.12);
        font-size: 17px;
    }

    .note-text {
        font-size: 13px;
        font-weight: 700;
    }

    .open-icon {
        color: var(--text-soft);
        font-size: 14px;
    }

    /* Modal */
    .modal {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(3,10,18,.65);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        opacity: 0;
        visibility: hidden;
        transition: .3s ease;
    }

    .modal.show {
        opacity: 1;
        visibility: visible;
    }

    .modal-box {
        width: min(430px, 100%);
        padding: 32px;
        text-align: center;
        border-radius: 28px;
        background:
            linear-gradient(
                145deg,
                rgba(19,43,73,.95),
                rgba(11,29,51,.97)
            );
        border: 1px solid rgba(214,176,106,.25);
        box-shadow: 0 30px 100px rgba(0,0,0,.45);
        transform: scale(.88) translateY(20px);
        transition: .35s cubic-bezier(.2,.8,.2,1);
        position: relative;
    }

    .modal.show .modal-box {
        transform: scale(1) translateY(0);
    }

    .close-btn {
        position: absolute;
        top: 13px;
        left: 13px;
        width: 38px;
        height: 38px;
        border: 1px solid rgba(255,255,255,.12);
        border-radius: 12px;
        background: rgba(255,255,255,.07);
        color: #fff;
        cursor: pointer;
        font-size: 20px;
        transition: .2s;
    }

    .close-btn:hover {
        background: rgba(185,139,69,.25);
        transform: rotate(90deg);
    }

    .download-icon {
        width: 90px;
        height: 90px;
        margin: 0 auto 20px;
        border-radius: 27px;
        display: grid;
        place-items: center;
        font-size: 42px;
        color: var(--cream);
        background:
            linear-gradient(135deg, var(--gold), var(--navy-light));
        box-shadow:
            0 15px 35px rgba(185,139,69,.22),
            inset 0 1px 0 rgba(255,255,255,.2);
    }

    .modal h3 {
        color: #fff;
        font-size: 21px;
        margin-bottom: 10px;
    }

    .modal p {
        color: #b8c2ce;
        font-size: 13px;
        line-height: 1.9;
        margin-bottom: 24px;
    }

    .download-btn {
        width: 100%;
        min-height: 53px;
        border: 0;
        border-radius: 16px;
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        background:
            linear-gradient(
                135deg,
                var(--gold),
                #8d6832,
                var(--navy-light)
            );
        box-shadow: 0 12px 30px rgba(185,139,69,.2);
        transition: .25s ease;
    }

    .download-btn:hover {
        transform: translateY(-2px);
        filter: brightness(1.1);
    }

    /* Footer */
    footer {
        text-align: center;
        color: var(--text-soft);
        font-size: 11px;
        padding: 5px 0 30px;
    }

    /* Responsive */
    @media (max-width: 900px) {
        .lessons-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 620px) {
        .container {
            width: min(100% - 20px, 500px);
        }

        header {
            padding-top: 15px;
        }

        .topbar {
            gap: 10px;
        }

        .logo {
            width: 48px;
            height: 48px;
            border-radius: 14px;
        }

        .brand h1 {
            font-size: 18px;
        }

        .brand p {
            font-size: 10px;
        }

        .theme-btn {
            width: 43px;
            height: 43px;
        }

        .hero {
            padding: 35px 5px 25px;
        }

        .hero h2 {
            font-size: 28px;
        }

        .hero p {
            font-size: 12px;
        }

        .lessons-grid {
            grid-template-columns: 1fr;
            gap: 12px;
        }

        .lesson {
            border-radius: 19px;
        }

        .lesson-header {
            min-height: 70px;
        }

        .modal-box {
            padding: 29px 22px 25px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
            animation-duration: .01ms !important;
            transition-duration: .01ms !important;
        }
    }
</style>


</head>

<body>


<header>
    <div class="container">
        <div class="topbar">

            <div class="brand">
                <div class="logo">۴۱</div>

                <div>
                    <h1>جزوات دانش‌کده ۴۱</h1>
                    <p>مرجع دسترسی سریع به جزوات درسی</p>
                </div>
            </div>

            <button
                class="glass-btn theme-btn"
                id="themeToggle"
                aria-label="تغییر تم"
                title="تغییر تم">
                ☀️
            </button>

        </div>
    </div>
</header>


<main class="container">

    <section class="hero">
        <span class="hero-badge">📚 جزوات درسی</span>

        <h2>جزوات دانش‌کده ۴۱</h2>

        <p>
            درس موردنظر خود را انتخاب کنید و از بین جزوات موجود،
            فایل موردنظر را به‌سادگی باز یا دانلود کنید.
        </p>
    </section>


    <section class="lessons-grid" id="lessonsGrid">
        <!-- درس‌ها توسط JavaScript ساخته می‌شوند -->
    </section>

</main>


<footer>
    جزوات دانش‌کده ۴۱
</footer>


<!-- Modal -->
<div class="modal" id="downloadModal">

    <div class="modal-box">

        <button
            class="close-btn"
            id="closeModal"
            aria-label="بستن">
            ×
        </button>

        <div class="download-icon">
            ↓
        </div>

        <h3 id="modalTitle">جزوه</h3>

        <p>
            برای دریافت فایل جزوه، روی دکمه دانلود بزنید.
        </p>

        <a
            class="download-btn"
            id="downloadLink"
            href="#"
            download>
            <span>⬇</span>
            دانلود جزوه
        </a>

    </div>

</div>


<script>

    /*
    ============================================================
    تنظیم لینک جزوه‌ها
    ============================================================

    برای هر جزوه، مقدار url را به آدرس واقعی فایل تغییر بده.

    مثال:
    url: "https://example.com/note.pdf"

    یا اگر فایل‌ها را داخل سایت گذاشتی:
    url: "lessons/lesson-1/notes-1.pdf"

    ============================================================
    */

    const lessons = [
        {
            id: 1,
            name: "درس شماره ۱",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-1/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-1/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-1/notes-3.pdf" }
            ]
        },
        {
            id: 2,
            name: "درس شماره ۲",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-2/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-2/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-2/notes-3.pdf" }
            ]
        },
        {
            id: 3,
            name: "درس شماره ۳",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-3/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-3/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-3/notes-3.pdf" }
            ]
        },
        {
            id: 4,
            name: "درس شماره ۴",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-4/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-4/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-4/notes-3.pdf" }
            ]
        },
        {
            id: 5,
            name: "درس شماره ۵",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-5/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-5/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-5/notes-3.pdf" }
            ]
        },
        {
            id: 6,
            name: "درس شماره ۶",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-6/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-6/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-6/notes-3.pdf" }
            ]
        },
        {
            id: 7,
            name: "درس شماره ۷",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-7/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-7/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-7/notes-3.pdf" }
            ]
        },
        {
            id: 8,
            name: "درس شماره ۸",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-8/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-8/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-8/notes-3.pdf" }
            ]
        },
        {
            id: 9,
            name: "درس شماره ۹",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-9/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-9/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-9/notes-3.pdf" }
            ]
        },
        {
            id: 10,
            name: "درس شماره ۱۰",
            notes: [
                { name: "جزوه شماره ۱", url: "lessons/lesson-10/notes-1.pdf" },
                { name: "جزوه شماره ۲", url: "lessons/lesson-10/notes-2.pdf" },
                { name: "جزوه شماره ۳", url: "lessons/lesson-10/notes-3.pdf" }
            ]
        }
    ];


    const grid = document.getElementById("lessonsGrid");


    /* ساخت کارت درس‌ها */

    lessons.forEach(lesson => {

        const article = document.createElement("article");
        article.className = "lesson";

        article.innerHTML = `
            <button class="lesson-header">
                <div class="lesson-title">

                    <div class="lesson-number">
                        ${lesson.id}
                    </div>

                    <div>
                        <div class="lesson-name">
                            ${lesson.name}
                        </div>

                        <span class="lesson-count">
                            ۳ جزوه
                        </span>
                    </div>

                </div>

                <span class="arrow">⌄</span>
            </button>

            <div class="notes">

                <div class="notes-inner">

                    ${lesson.notes.map((note, index) => `
                        <button
                            class="note"
                            data-lesson="${lesson.id}"
                            data-note="${index}"
                        >

                            <span class="note-left">

                                <span class="note-icon">
                                    📄
                                </span>

                                <span class="note-text">
                                    ${note.name}
                                </span>

                            </span>

                            <span class="open-icon">
                                ↗
                            </span>

                        </button>
                    `).join("")}

                </div>

            </div>
        `;

        grid.appendChild(article);
    });


    /* آکاردئون */

    document.querySelectorAll(".lesson-header").forEach(header => {

        header.addEventListener("click", () => {

            const lesson = header.parentElement;
            const notes = lesson.querySelector(".notes");

            const isOpen = lesson.classList.contains("active");


            /* بستن همه */

            document.querySelectorAll(".lesson.active").forEach(item => {

                item.classList.remove("active");

                item.querySelector(".notes").style.maxHeight = null;

            });


            /* باز کردن مورد انتخاب‌شده */

            if (!isOpen) {

                lesson.classList.add("active");

                notes.style.maxHeight = notes.scrollHeight + "px";

            }

        });

    });


    /* Modal */

    const modal = document.getElementById("downloadModal");
    const closeModal = document.getElementById("closeModal");
    const modalTitle = document.getElementById("modalTitle");
    const downloadLink = document.getElementById("downloadLink");


    document.querySelectorAll(".note").forEach(note => {

        note.addEventListener("click", () => {

            const lessonId = Number(note.dataset.lesson);
            const noteIndex = Number(note.dataset.note);

            const selectedLesson = lessons.find(
                lesson => lesson.id === lessonId
            );

            const selectedNote = selectedLesson.notes[noteIndex];


            modalTitle.textContent =
                `${selectedLesson.name} — ${selectedNote.name}`;

            downloadLink.href = selectedNote.url;

            modal.classList.add("show");

            document.body.style.overflow = "hidden";

        });

    });


    function closeDownloadModal() {

        modal.classList.remove("show");

        document.body.style.overflow = "";

    }


    closeModal.addEventListener("click", closeDownloadModal);


    /* کلیک بیرون مودال */

    modal.addEventListener("click", event => {

        if (event.target === modal) {
            closeDownloadModal();
        }

    });


    /* کلید Escape */

    document.addEventListener("keydown", event => {

        if (event.key === "Escape") {
            closeDownloadModal();
        }

    });


    /* Dark / Light Mode */

    const themeToggle = document.getElementById("themeToggle");


    function updateThemeIcon() {

        themeToggle.textContent =
            document.body.classList.contains("dark")
                ? "☀️"
                : "🌙";

    }


    const savedTheme = localStorage.getItem("theme");


    if (savedTheme === "dark") {
        document.body.classList.add("dark");
    }


    updateThemeIcon();


    themeToggle.addEventListener("click", () => {

        document.body.classList.toggle("dark");

        const isDark =
            document.body.classList.contains("dark");

        localStorage.setItem(
            "theme",
            isDark ? "dark" : "light"
        );

        updateThemeIcon();

    });

</script>


</body>
</html>
